name: 功能建议 / Feature request
description: 描述用户问题、边界和可验证的改进方案。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        功能建议应保留本地优先、最小权限、数据诚实和人工审核原则。
        项目不会实现绕过访问控制、版权保护、验证码或平台风控的功能。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues 和 ROADMAP。
          required: true
        - label: 该建议只面向我有权操作的账号和内容。
          required: true
        - label: 该建议不要求打包许可证不明确的第三方源码。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述场景和影响，不要只写一个实现名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户体验、接口、默认值和失败状态。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 能力范围
      options:
        - 仓库内核心
        - 可选外置适配器
        - 文档或社区
        - 不确定
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全、隐私与人工审核
      description: 需要哪些权限、数据、确认门、审计和停止条件？
    validations:
      required: true
  - type: textarea
    id: third_party
    attributes:
      label: 第三方依赖
      description: 如有，请提供官方上游、固定版本、许可证和分发方式；没有请填“无”。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 当前如何完成，或为何现有方案不足？
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与方式
      options:
        - label: 我愿意补充设计或测试。
        - label: 我愿意提交 Pull Request。
